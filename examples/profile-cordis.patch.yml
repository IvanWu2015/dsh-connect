# 追加到 DSH profile 的 cordis.patch.yml（Host 平面，非 agent preset 内）
#
# 说明：
# - dsh-connect 与 dsh-connect-feishu 必须挂 Host 平面（进程级单例服务）。
# - 用 `insert` 段新增插件；`id` 是本地唯一标识，`name` 是 npm 包名。
# - 凭据也可走环境变量 FEISHU_APP_ID / FEISHU_APP_SECRET，避免写入配置文件。

- insert:
    - id: connect
      name: dsh-connect
      config:
        # agentPreset: standard      # 每个绑定会话采用的 Agent 预设（省略=roster 默认）
        # workDir: D:\your\workdir   # Agent 工作目录（绝对路径）
        # workspaces:                # /dir 点选时列出的工作目录
        #   - D:\projects\app-a
        #   - D:\projects\app-b
        # allowUsers: ['ou_xxx']     # 发送者白名单（空=全部放行）
        # allowChats: ['oc_xxx']     # 会话白名单（空=全部放行）
        # stateDir: .dsh-connect     # 绑定路由 bindings.json 目录

    - id: connect-feishu
      name: dsh-connect-feishu
      config:
        appId: cli_xxxx
        appSecret: cli_secret_xxxx
        transport: websocket          # 长连接（推荐）；webhook 需公网 HTTPS
        requireMention: true          # 群聊需 @机器人 才响应
        dmMode: open                  # 单聊策略：open / allowlist / pair / disabled
