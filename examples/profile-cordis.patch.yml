# Append to the DSH profile's cordis.patch.yml (Host plane, not inside an agent preset)
#
# Notes:
# - dsh-connect and dsh-connect-feishu must live on the Host plane (process-level singleton services).
# - Each package registers itself automatically via its bundle manifest
#   (`dsh.bundle.patch` → cordis.patch.yml), so this file only OVERRIDES their
#   config. Do NOT `insert` them here — re-inserting the same ids makes the
#   loader fail with "duplicate loader entry id" and dsh refuses to boot.
# - Credentials can also come from the environment variables FEISHU_APP_ID /
#   FEISHU_APP_SECRET to keep them out of config files.

- id: connect
  name: dsh-connect
  config:
    # agentPreset: standard      # Agent preset used per bound session (omitted = roster default)
    # workDir: D:\your\workdir   # Agent working directory (absolute path)
    # workspaces:                # Workdirs listed in the /dir picker
    #   - D:\projects\app-a
    #   - D:\projects\app-b
    # visionModel: { provider: openai, model: gpt-4o }  # vision model for image sub-tasks
    # language: en                                     # user-facing message language: zh (default) / en
    # allowUsers: ['ou_xxx']     # Sender allowlist (empty = allow all)
    # allowChats: ['oc_xxx']     # Chat allowlist (empty = allow all)
    # stateDir: .dsh-connect     # Directory for the binding route bindings.json
    # streamHeartbeatMs: 60000   # Streaming-card liveness heartbeat ms (0 = off)
    # notifyLevel: important  # Streaming detail: full | important (default) | result
    # progressTimeoutMs: 300000  # Proactive progress-notice interval ms (0 = off; default 300000 = 5 min)

- id: connect-feishu
  name: dsh-connect-feishu
  config:
    appId: cli_xxxx
    appSecret: cli_secret_xxxx
    transport: websocket          # long connection (recommended); webhook needs public HTTPS
    requireMention: true          # groups only respond when @mentioned
    dmMode: open                  # DM policy: open / allowlist / pair / disabled
    # language: en                # user-facing message language: zh (default) / en
    # --- only for transport: webhook ---
    # webhookPort: 9000           # HTTP port the built-in webhook server listens on (default 9000)
    # webhookPath: /              # URL path Feishu event callbacks post to (default "/")
    # verificationToken: "xxx"    # webhook verification token (secret)
    # encryptKey: "xxx"           # webhook encrypt key (secret)

- id: connect-telegram
  name: dsh-connect-telegram
  config:
    botToken: "123456:ABC-YourBotToken"  # from @BotFather; or env TELEGRAM_BOT_TOKEN
    requireMention: true                 # groups only respond when @mentioned
    # language: en
    # pollingTimeoutSeconds: 50          # getUpdates long-poll timeout in seconds (default 50)
    # baseUrl: "http://localhost:8081"   # Bot API base URL override (local Bot API server)

- id: connect-dingtalk
  name: dsh-connect-dingtalk
  config:
    webhookUrl: "https://oapi.dingtalk.com/robot/send?access_token=xxx"  # or env DINGTALK_WEBHOOK_URL
    # secret: "SECxxx"             # only if the robot has signing enabled
    # language: en
    # defaultAt:                   # @-mention on every push
    #   mobiles: ["13800000000"]
