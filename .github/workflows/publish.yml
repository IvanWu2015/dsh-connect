# Publish all dsh-connect packages to npm using npm Trusted Publishing (OIDC).
#
# No npm token is stored anywhere. The publish-npm job authenticates to npm via
# GitHub Actions OIDC (short-lived credentials), so you must configure each
# package on npmjs.com to trust this repo's publish.yml workflow:
#   package → Settings → Publishing Access → "Add Trusted Publisher"
#   - Platform: GitHub Actions
#   - Repository: IvanWu2015/dsh-connect
#   - Workflow filename: publish.yml
# npm requires each package to already exist on the registry before OIDC can be
# configured (it does — 0.6.6 is live), and the npm CLI must be >= 11.5.1
# (upgraded in the publish job below).
#
# Packages are published sequentially in dependency order (connect first,
# adapters after) — a parallel matrix would race the peerDependency.
# `pnpm build` runs before test and publish because lib/ is gitignored.

name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC trusted publishing — GitHub issues the token npm verifies
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Ensure npm CLI supports OIDC (>= 11.5.1)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish dsh-connect (core, first)
        working-directory: packages/connect
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-connect@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-connect@${VERSION} already published — skipping"
          else
            npm publish --provenance
          fi
      - name: Publish dsh-connect-feishu
        working-directory: packages/connect-feishu
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-connect-feishu@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-connect-feishu@${VERSION} already published — skipping"
          else
            npm publish --provenance
          fi
      - name: Publish dsh-connect-telegram
        working-directory: packages/connect-telegram
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-connect-telegram@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-connect-telegram@${VERSION} already published — skipping"
          else
            npm publish --provenance
          fi
      - name: Publish dsh-connect-dingtalk
        working-directory: packages/connect-dingtalk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-connect-dingtalk@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-connect-dingtalk@${VERSION} already published — skipping"
          else
            npm publish --provenance
          fi
      - name: Publish dsh-connect-web
        working-directory: packages/connect-web
        run: |
          # pnpm's workspace protocol is meaningless on the registry — pin the
          # core dependency to this package's own version before publishing.
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json'));j.dependencies['dsh-connect']=j.version;fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n')"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-connect-web@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-connect-web@${VERSION} already published — skipping"
          else
            npm publish --provenance
          fi
